<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MARO GAMES</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:'Cairo',sans-serif;margin:0}
header{background:#000;padding:15px;text-align:center;border-bottom:3px solid #7b2fff}
.logo{font-size:30px;color:#7b2fff;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:15px;padding:20px}
.card{background:#111;border-radius:15px;cursor:pointer;border:2px solid #222;overflow:hidden}
.card:hover{border-color:#7b2fff;transform:scale(1.05)}
.card img{width:100%;height:150px;object-fit:cover}
.card h3{padding:10px;text-align:center;font-size:15px}
.game-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;display:none;flex-direction:column}
.game-header{padding:15px;background:#000;display:flex;justify-content:space-between;border-bottom:3px solid #7b2fff}
.close-btn{padding:10px 20px;background:#7b2fff;color:#fff;border:none;border-radius:10px;font-weight:900;cursor:pointer}
.game-screen iframe{width:100%;flex:1;border:none}
</style>
</head>
<body>

<header><div class="logo">MARO GAMES</div></header>

<div class="grid">
  <div class="card" onclick="playGame('https://html5.gamemonetize.com/3ivzvhf9w9i3v1bq6g7q8w9e0r1t2y3u/')">
    <img src="https://img.gamemonetize.com/3ivzvhf9w9i3v1bq6g7q8w9e0r1t2y3u/512x384.jpg">
    <h3>Subway Runner</h3>
  </div>

  <div class="card" onclick="playGame('https://html5.gamemonetize.com/1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p/')">
    <img src="https://img.gamemonetize.com/1a2b3c4d5e6f7g8h9i0j1k2l3m4n5o6p/512x384.jpg">
    <h3>Drift Boss</h3>
  </div>

  <div class="card" onclick="playGame('https://html5.gamemonetize.com/qwertyuiopasdfghjklzxcvbnm/')">
    <img src="https://img.gamemonetize.com/qwertyuiopasdfghjklzxcvbnm/512x384.jpg">
    <h3>Stickman Fight</h3>
  </div>

  <div class="card" onclick="playGame('https://html5.gamemonetize.com/zxcvbnmasdfghjklqwertyuiop/')">
    <img src="https://img.gamemonetize.com/zxcvbnmasdfghjklqwertyuiop/512x384.jpg">
    <h3>2048 Game</h3>
  </div>
</div>

<div class="game-screen" id="gameScreen">
  <div class="game-header">
    <div class="logo">MARO GAMES</div>
    <button class="close-btn" onclick="closeGame()">X اغلاق</button>
  </div>
  <iframe id="gameFrame" src="" allowfullscreen></iframe>
</div>

<script>
function playGame(url){
  document.getElementById('gameFrame').src = url;
  document.getElementById('gameScreen').style.display = 'flex';
}
function closeGame(){
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('gameFrame').src = '';
}
</script>

</body>
</html>
