<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MARO GAMES</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght=800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:'Cairo'}
header{padding:30px;text-align:center;border-bottom:1px solid #333}
.logo{font-size:45px;font-weight:900;letter-spacing:2px}

.games{display:flex;flex-direction:column;gap:40px;padding:40px;max-width:600px;margin:auto}
.game{background:#111;border:1px solid #333;border-radius:12px;padding:20px}
.game h3{margin-bottom:15px;font-size:22px;text-align:center}
canvas{background:#000;border:1px solid #333;border-radius:8px;width:100%;height:300px;display:block}
.btn{width:100%;padding:12px;margin-top:15px;background:#fff;color:#000;border:none;border-radius:8px;font-size:18px;font-weight:900;cursor:pointer}
.btn:hover{background:#ddd}

footer{text-align:center;padding:30px;color:#666;border-top:1px solid #333}
</style>
</head>
<body>

<header><div class="logo">MARO GAMES</div></header>

<div class="games">

  <!-- لعبة 1: سوسو -->
  <div class="game">
    <h3>سوسو</h3>
    <canvas id="soso" width="400" height="300"></canvas>
    <button class="btn" onclick="startSoso()">العب</button>
  </div>

  <!-- لعبة 2: الثعبان -->
  <div class="game">
    <h3>الثعبان</h3>
    <canvas id="snake" width="400" height="300"></canvas>
    <button class="btn" onclick="startSnake()">العب</button>
  </div>

  <!-- لعبة 3: بريك اوت -->
  <div class="game">
    <h3>تكسير الطوب</h3>
    <canvas id="break" width="400" height="300"></canvas>
    <button class="btn" onclick="startBreak()">العب</button>
  </div>

</div>

<footer>© 2026 MARO GAMES</footer>

<script>
// ===== لعبة سوسو - Dress Up بجد =====
function startSoso(){
  let c=soso.getContext('2d'),hair=0,dress=0;
  let hairs=['طويل','قصير','كيرلي'],dresses=['ازرق','اسود','ابيض'];

  function draw(){
    c.fillStyle='#000';c.fillRect(0,0,400,300);
    c.fillStyle='#fff';c.font='18px Cairo';c.textAlign='center';
    c.fillText('تسريحة: '+hairs[hair],200,30);
    c.fillText('لبس: '+dresses[dress],200,55);

    // بنت بسيطة
    c.fillStyle='#fdb';c.beginPath();c.arc(200,120,30,0,6.28);c.fill();
    c.fillRect(185,150,30,80);
    c.fillStyle=['#0033ff','#000','#fff'][dress];
    c.fillRect(170,150,60,90);
  }
  draw();

  soso.onclick=e=>{
    if(e.offsetY<100){hair=(hair+1)%3}
    else{dress=(dress+1)%3}
    draw();
  }
  alert('دوس فوق للشعر، تحت للبس')
}

// ===== لعبة الثعبان شغالة =====
function startSnake(){
  let c=snake.getContext('2d'),sn=[{x:200,y:150}],dx=20,dy=0,food={x:100,y:100};
  document.onkeydown=e=>{if(e.key=='ArrowUp'&&dy==0){dx=0;dy=-20}if(e.key=='ArrowDown'&&dy==0){dx=0;dy=20}if(e.key=='ArrowLeft'&&dx==0){dx=-20;dy=0}if(e.key=='ArrowRight'&&dx==0){dx=20;dy=0}};
  let t=setInterval(()=>{
    c.fillStyle='#000';c.fillRect(0,0,400,300);
    let head={x:sn[0].x+dx,y:sn[0].y+dy};sn.unshift(head);
    if(head.x==food.x&&head.y==food.y){food.x=Math.floor(Math.random()*20)*20;food.y=Math.floor(Math.random()*15)*20}else sn.pop();
    c.fillStyle='#0f0';c.fillRect(food.x,food.y,20,20);
    c.fillStyle='#fff';sn.forEach(s=>c.fillRect(s.x,s.y,20,20));
    if(head.x<0||head.x>=400||head.y<0||head.y>=300){clearInterval(t);alert('Game Over')}
  },150)
}

// ===== لعبة تكسير الطوب شغالة =====
function startBreak(){
  let c=break.getContext('2d'),x=200,y=250,dx=3,dy=-3,px=160,bricks=[];
  for(let i=0;i<5;i++)for(let j=0;j<8;j++)bricks.push({x:j*50,y:i*25+30});
  break.onmousemove=e=>px=e.offsetX-40;
  let t=setInterval(()=>{
    c.fillStyle='#000';c.fillRect(0,0,400,300);
    c.fillStyle='#fff';c.fillRect(px,280,80,10);
    c.beginPath();c.arc(x,y,8,0,6.28);c.fill();
    x+=dx;y+=dy;if(x<0||x>400)dx*=-1;if(y<0)dy*=-1;
    if(x>px&&x<px+80&&y>270)dy*=-1;
    bricks.forEach((b,i)=>{c.fillRect(b.x,b.y,48,20);if(x>b.x&&x<b.x+48&&y>b.y&&y<b.y+20){dy*=-1;bricks.splice(i,1)}});
    if(y>300){clearInterval(t);alert('خلصت')}
    if(bricks.length==0){clearInterval(t);alert('كسبت!')}
  },20)
}
</script>

</body>
</html>
