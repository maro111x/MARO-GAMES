<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>MARO GAMES - 50 لعبة</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght=800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050505;color:#fff;font-family:'Cairo'}
header{position:sticky;top:0;width:100%;background:#000;padding:20px;text-align:center;border-bottom:2px solid #0066ff;z-index:1000}
.logo{font-size:40px;font-weight:900;color:#0066ff}
.section{padding:40px 3%}
h2{font-size:35px;margin-bottom:30px;color:#0066ff;text-align:center}
.games-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
.game-box{background:#0a0a0a;border:2px solid #0066ff;border-radius:15px;padding:15px}
.game-box h3{color:#00aaff;margin-bottom:10px;text-align:center;font-size:16px}
canvas{background:#000;border:2px solid #0066ff;border-radius:10px;width:100%;height:250px;display:block}
.btn{background:#0066ff;color:#fff;border:none;padding:8px;border-radius:8px;font-size:15px;font-weight:900;cursor:pointer;margin-top:8px;width:100%}
.btn:hover{background:#00aaff}
.score{color:#00ffaa;font-size:16px;text-align:center;margin-top:5px}
.controls{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.controls button{flex:1;padding:5px;font-size:12px;background:#0a1a3a;border:1px solid #0066ff;color:#fff;border-radius:5px;cursor:pointer}
.controls button:hover{background:#0066ff}
footer{text-align:center;padding:30px;background:#000;border-top:2px solid #0066ff;margin-top:40px;color:#aaa}
</style>
</head>
<body>

<header><div class="logo">MARO GAMES</div></header>

<section class="section">
  <h2>🎮 50 لعبة - العب مباشر</h2>
  <div class="games-grid" id="gamesContainer"></div>
</section>

<footer><p>© 2026 MARO GAMES</p></footer>

<script>
const gamesData = [
{no:1,name:"سوسو 👑",desc:"لعبة البنات - ميكب ولبس وتسريحات"},{no:2,name:"جامع النقط",desc:"لم المربعات الزرقا"},
{no:3,name:"الثعبان",desc:"كبر الثعبان بتاعك"},{no:4,name:"تفادي الكرات",desc:"اهرب من الكرات"},
{no:5,name:"بينج بونج",desc:"العبة لوحدك"},{no:6,name:"XO",desc:"اكس او كلاسيك"},
{no:7,name:"اضرب الهدف",desc:"اضرب الدايرة الزرقا"},{no:8,name:"تكسير الطوب",desc:"كسر كل الطوب"},
{no:9,name:"فلابي طير",desc:"عدي بين المواسير"},{no:10,name:"2048",desc:"جمع الارقام"},
{no:11,name:"ذاكرة",desc:"افتكر مكان الكروت"},{no:12,name:"سباق",desc:"دوس بسرعة"},
{no:13,name:"سلم و تعبان",desc:"ارمي النرد"},{no:14,name:"كلمة السر",desc:"خمن الحرف"},
{no:15,name:"نط الحواجز",desc:"انط في الوقت الصح"},{no:16,name:"تلوين",desc:"لون المربعات"}
];
for(let i=17;i<=50;i++){gamesData.push({no:i,name:"لعبة "+i,desc:"قريبا"})}

let container=document.getElementById('gamesContainer');
gamesData.forEach(g=>{
  container.innerHTML+=`
  <div class="game-box">
    <h3>${g.no}. ${g.name}</h3>
    <canvas id="game${g.no}" width="300" height="250"></canvas>
    <div class="score" id="score${g.no}">النقاط: 0</div>
    <div class="controls" id="ctrl${g.no}"></div>
    <button class="btn" onclick="startGame${g.no}()">ابدأ</button>
  </div>`;
});

// ========= لعبة 1: سوسو - Dress Up احترافية =========
let sosoState = {hair:0, dress:0, makeup:0, bg:0, points:0};
const hairStyles = ['شعر طويل','شعر قصير','ضفيرة','كيرلي'];
const dresses = ['فستان ازرق','فستان وردي','جمبسوت','فستان سهرة'];
const makeups = ['طبيعي','سهرة','نيون','ملكي'];
const backgrounds = ['غرفة','حديقة','قصر','شاطئ'];

function startGame1(){
  sosoState = {hair:0, dress:0, makeup:0, bg:0, points:0};
  drawSoso();
  document.getElementById('ctrl1').innerHTML=`
    <button onclick="changeSoso('hair')">تسريحة</button>
    <button onclick="changeSoso('dress')">فستان</button>
    <button onclick="changeSoso('makeup')">ميكب</button>
    <button onclick="changeSoso('bg')">خلفية</button>
  `;
}

function changeSoso(type){
  if(type=='hair') sosoState.hair = (sosoState.hair+1)%4;
  if(type=='dress') sosoState.dress = (sosoState.dress+1)%4;
  if(type=='makeup') sosoState.makeup = (sosoState.makeup+1)%4;
  if(type=='bg') sosoState.bg = (sosoState.bg+1)%4;
  sosoState.points += 10;
  score1.innerText = "النقاط: " + sosoState.points;
  drawSoso();
}

function drawSoso(){
  let c = game1.getContext('2d');
  // خلفية
  let bgColors = ['#1a1a3a','#2a1a3a','#1a2a3a','#3a1a2a'];
  c.fillStyle = bgColors[sosoState.bg];
  c.fillRect(0,0,300,250);

  // جسم البنت
  c.fillStyle = '#ffdbac';
  c.beginPath();c.arc(150,80,25,0,6.28);c.fill(); // راس
  c.fillRect(140,105,20,60); // جسم

  // الفستان
  let dressColors = ['#0066ff','#ff66cc','#00aaff','#aa00ff'];
  c.fillStyle = dressColors[sosoState.dress];
  c.beginPath();c.moveTo(140,105);c.lineTo(160,105);c.lineTo(170,180);c.lineTo(130,180);c.closePath();c.fill();

  // الشعر
  c.fillStyle = '#4a2c17';
  if(sosoState.hair==0) c.fillRect(125,55,50,30); // طويل
  if(sosoState.hair==1) c.fillRect(130,60,40,15); // قصير
  if(sosoState.hair==2){c.fillRect(125,55,10,40);c.fillRect(165,55,10,40)} // ضفيرة
  if(sosoState.hair==3){for(let i=0;i<5;i++)c.beginPath(),c.arc(130+i*10,65,8,0,6.28),c.fill()} // كيرلي

  // الميكب
  let makeupColors = ['#ffb6c1','#ff1493','#00ffff','#ffd700'];
  c.fillStyle = makeupColors[sosoState.makeup];
  c.beginPath();c.arc(140,80,3,0,6.28);c.fill(); // خد
  c.beginPath();c.arc(160,80,3,0,6.28);c.fill();
  c.fillRect(145,88,10,3); // شفايف

  // نص
  c.fillStyle='#fff';c.font='12px Cairo';c.textAlign='center';
  c.fillText(hairStyles[sosoState.hair],150,210);
  c.fillText(dresses[sosoState.dress],150,225);
  c.fillText(makeups[sosoState.makeup],150,240);
}

// ========= باقي الالعاب الشغالة =========
function startGame2(){let c=game2.getContext('2d'),x=150,y=125,s=0,f={x:90,y:90};onkeydown=e=>{if(e.key=='ArrowUp')y-=10;if(e.key=='ArrowDown')y+=10;if(e.key=='ArrowLeft')x-=10;if(e.key=='ArrowRight')x+=10};let t=setInterval(()=>{c.fillStyle='#000';c.fillRect(0,0,300,250);c.fillStyle='#06f';c.fillRect(x,y,10,10);c.fillStyle='#0af';c.fillRect(f.x,f.y,10,10);if(x==f.x&&y==f.y){s++;score2.innerText="النقاط: "+s;f.x=Math.floor(Math.random()*30)*10;f.y=Math.floor(Math.random()*25)*10}if(x<0||x>290||y<0||y>240){clearInterval(t)}},100)}
function startGame3(){let c=game3.getContext('2d'),sn=[{x:150,y:125}],dx=10,dy=0,s=0,f={x:90,y:90};onkeydown=e=>{if(e.key=='ArrowUp')dx=0,dy=-10;if(e.key=='ArrowDown')dx=0,dy=10;if(e.key=='ArrowLeft')dx=-10,dy=0;if(e.key=='ArrowRight')dx=10,dy=0};let t=setInterval(()=>{c.fillStyle='#000';c.fillRect(0,0,300,250);let h={x:sn[0].x+dx,y:sn[0].y+dy};sn.unshift(h);if(h.x==f.x&&h.y==f.y){s++;score3.innerText="النقاط: "+s;f.x=Math.floor(Math.random()*30)*10;f.y=Math.floor(Math.random()*25)*10}else sn.pop();c.fillStyle='#0af';c.fillRect(f.x,f.y,10,10);c.fillStyle='#06f';sn.forEach(p=>c.fillRect(p.x,p.y,10,10));if(h.x<0||h.x>290||h.y<0||h.y>240)clearInterval(t)},120)}
function startGame4(){let c=game4.getContext('2d'),x=150,s=0,b=[];game4.onmousemove=e=>x=e.offsetX;let t=setInterval(()=>{c.fillStyle='#000';c.fillRect(0,0,300,250);c.fillStyle='#06f';c.fillRect(x-15,230,30,10);if(Math.random()<0.1)b.push({x:Math.random()*300,y:0});b.forEach(o=>{o.y+=4;c.fillStyle='#0af';c.beginPath();c.arc(o.x,o.y,6,0,6.28);c.fill();if(o.y>220&&o.x>x-15&&o.x<x+15)clearInterval(t);if(o.y>250)s++,score4.innerText="النقاط: "+s});b=b.filter(o=>o.y<250)},30)}
function startGame5(){let c=game5.getContext('2d'),py=100,bx=150,by=125,bdx=3,bdy=3,s=0;game5.onmousemove=e=>py=e.offsetY-25;let t=setInterval(()=>{c.fillStyle='#000';c.fillRect(0,0,300,250);c.fillStyle='#06f';c.fillRect(10,py,10,50);c.fillStyle='#0af';c.beginPath();c.arc(bx,by,7,0,6.28);c.fill();bx+=bdx;by+=bdy;if(by<0||by>250)bdy*=-1;if(bx<20&&by>py&&by<py+50){bdx*=-1;s++;score5.innerText="النقاط: "+s}if(bx>300)clearInterval(t)},20)}
let xo=['','',''],xt='X';function startGame6(){xo=['','',''];xt='X';draw6()}function draw6(){let c=game6.getContext('2d');c.fillStyle='#000';c.fillRect(0,0,300,250);c.strokeStyle='#06f';c.lineWidth=3;for(let i=1;i<3;i++){c.beginPath();c.moveTo(i*100,0);c.lineTo(i*100,250);c.stroke();c.beginPath();c.moveTo(0,i*83);c.lineTo(300,i*83);c.stroke()}xo.forEach((v,i)=>{if(v){c.fillStyle='#0af';c.font='40px Cairo';c.fillText(v,(i%3)*100+40,Math.floor(i/3)*83+55)}})}game6.onclick=e=>{let i=Math.floor(e.offsetX/100)+Math.floor(e.offsetY/83)*3;if(xo[i]==''){xo[i]=xt;xt=xt=='X'?'O':'X';draw6()}}
function startGame7(){let c=game7.getContext('2d'),s=0,t={x:150,y:125};game7.onclick=e=>{let x=e.offsetX,y=e.offsetY;if(Math.abs(x-t.x)<15&&Math.abs(y-t.y)<15){s++;score7.innerText="النقاط: "+s;t.x=Math.random()*260+20;t.y=Math.random()*210+20}};setInterval(()=>{c.fillStyle='#000';c.fillRect(0,0,300,250);c.fillStyle='#06f';c.beginPath();c.arc(t.x,t.y,15,0,6.28);c.fill();c.fillStyle='#0af';c.beginPath();c.arc(t.x,t.y,7,0,6.28);c.fill()},30)}

// الباقي فاضي لحد 50
for(let i=8;i<=50;i++)window['startGame'+i]=()=>alert('اللعبة '+i+' قريبا');

</script>
</body>
</html>
